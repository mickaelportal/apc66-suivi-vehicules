<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APC66 — Contrôle véhicule</title><style>body{font:16px system-ui,Arial;background:#f1f5fa;color:#173254;margin:0}main{max-width:650px;margin:24px auto;padding:20px;background:white;border-radius:16px;box-shadow:0 5px 20px #1232}h1{color:#123b65;font-size:24px}h2{font-size:20px}label{display:block;margin:13px 0;font-weight:650}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:5px;border:1px solid #aebbc9;border-radius:8px;font:inherit}button{padding:12px 18px;border:0;border-radius:9px;background:#174d7b;color:white;font-weight:700;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}.secondary{background:#e7eef5;color:#173254}.hint{color:#52677c;font-size:14px}.error{color:#9e2020}.success{color:#176437}.card{padding:12px;border:1px solid #d5dfe8;border-radius:10px;margin:10px 0}fieldset{border:1px solid #d5dfe8;border-radius:10px;margin:16px 0}legend{font-weight:700}#status{white-space:pre-wrap}</style></head><body><main><h1>APC66 — Contrôle véhicule</h1><p class="hint">Contrôle public sans connexion. Les informations sont enregistrées pour le suivi du parc.</p><div id="status" role="status">Chargement du véhicule…</div><section id="app" hidden><h2 id="vehicle"></h2><div id="menu"><button id="depart">Avant départ</button><button id="retour">Retour de poste</button></div><div id="editor" hidden><h2 id="heading"></h2><form id="form"><div id="postpick" hidden><label>Poste à clôturer *<select id="post_id" name="post_id"></select></label></div><label>Nom du conducteur *<input name="driver" maxlength="160" required></label><label>Nom du DPS *<input name="dps" maxlength="160" required></label><label>Kilométrage *<input name="km" type="number" min="0" max="9999999" step="1" required></label><label>Niveau de carburant *<select name="fuel" required><option value="">Choisir…</option><option value="plein">Plein</option><option value="3/4">3/4</option><option value="1/2">1/2</option><option value="1/4">1/4</option><option value="reserve">Réserve</option></select></label><div id="before"><fieldset><legend>Vérifications visuelles</legend><div id="checks"></div></fieldset></div><div id="after" hidden><label>Plein effectué ? *<select name="refueled"><option value="false">Non</option><option value="true">Oui</option></select></label><label>Problème mécanique rencontré ? *<select name="mechanical_problem"><option value="false">Non</option><option value="true">Oui</option></select></label></div><label>Notes / observations (facultatif)<textarea name="notes" maxlength="3000" rows="4"></textarea></label><label>Photos (facultatives, 5 maximum, 5 Mo chacune)<input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><button id="submit" type="submit">Enregistrer</button><button id="cancel" type="button" class="secondary">Annuler</button></form></div></section></main><script>
(()=>{'use strict';const EDGE='https://deevoohyuvgwixniieje.supabase.co/functions/v1/apc66-vehicule-public';const token=new URL(location.href).searchParams.get('token')||location.hash.match(/^#vehicule-controle=([0-9a-f-]{36})$/i)?.[1];const $=id=>document.getElementById(id);let posts=[],phase='depart';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=(msg,cls='')=>{$('status').className=cls;$('status').textContent=msg};async function load(){if(!token){status('QR code invalide ou incomplet.','error');return}try{const r=await fetch(EDGE+'?token='+encodeURIComponent(token));const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur de lecture');posts=j.open_posts||[];$('vehicle').textContent=(j.vehicle?.name||'Véhicule')+(j.vehicle?.plate?' — '+j.vehicle.plate:'');$('app').hidden=false;status('');}catch(e){status(e.message,'error')}}const labels=[['tires','Pneus'],['body','Carrosserie'],['siren','Deux-tons'],['beacons','Gyrophares']];$('checks').innerHTML=labels.map(([k,t])=>`<label>${t} *<select name="${k}"><option value="ok">Conforme</option><option value="probleme">Problème constaté</option></select></label>`).join('');function start(p){phase=p;$('form').reset();$('heading').textContent=p==='depart'?'Contrôle avant départ':'Contrôle au retour';$('before').hidden=p!=='depart';$('after').hidden=p!=='retour';$('postpick').hidden=p!=='retour';for(const el of $('before').querySelectorAll('select'))el.disabled=p!=='depart';for(const el of $('after').querySelectorAll('select'))el.disabled=p!=='retour';if(p==='retour'){if(!posts.length){status('Aucun poste ouvert pour ce véhicule.','error');return}$('post_id').innerHTML=posts.map(x=>`<option value="${esc(x.id)}">${esc(x.departure_dps)} — ${esc(x.departure_driver)} — ${new Date(x.departure_at).toLocaleString('fr-FR')} — ${Number(x.departure_km).toLocaleString('fr-FR')} km</option>`).join('');$('post_id').disabled=false}else $('post_id').disabled=true;$('menu').hidden=true;$('editor').hidden=false;status('')}function cancel(){$('menu').hidden=false;$('editor').hidden=true;status('')}$('depart').onclick=()=>start('depart');$('retour').onclick=()=>start('retour');$('cancel').onclick=cancel;$('form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;const fd=new FormData(form);const photos=Array.from(form.elements.photos.files||[]);if(photos.length>5||photos.some(f=>f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))){status('Maximum 5 photos JPEG/PNG/WebP de 5 Mo chacune.','error');return}const payload={token,action:phase,driver:fd.get('driver'),dps:fd.get('dps'),km:fd.get('km'),fuel:fd.get('fuel'),notes:fd.get('notes')};if(phase==='depart'){for(const [k] of labels)payload[k]=fd.get(k)}else{payload.post_id=fd.get('post_id');payload.refueled=fd.get('refueled')==='true';payload.mechanical_problem=fd.get('mechanical_problem')==='true'}const body=new FormData();body.append('payload',JSON.stringify(payload));for(const f of photos)body.append('photos',f);$('submit').disabled=true;status('Enregistrement en cours…');try{const r=await fetch(EDGE,{method:'POST',body});const j=await r.json();if(!r.ok)throw Error(j.error||'Échec de l’enregistrement');status('Contrôle enregistré. '+j.photos_saved+' photo(s) enregistrée(s).'+(j.warnings?.length?' Attention : '+j.warnings.join(' '):''),'success');cancel();await load();status('Contrôle enregistré avec succès.','success')}catch(err){status(err.message,'error')}finally{$('submit').disabled=false}};load()})();
</script></body></html>
